# Runs Sprout behind the egress allowlist.
# Usage (from the repository root, with podman-compose):
#   podman-compose -f reconstitution/egress/compose.yaml up --build
# The agent container is on the `inside` network, which has NO route out;
# the proxy is the only host with external access.

services:
  egress:
    build:
      context: .
      dockerfile: Containerfile
    networks:
      - inside
      - outside

  sprout:
    build:
      context: ../..
      dockerfile: reconstitution/Containerfile
    depends_on:
      - egress
    environment:
      - OPENROUTER_API_KEY
      - GH_TOKEN
      - TELEGRAM_BOT_TOKEN
      - OPENMAIL_API_KEY
      - HTTP_PROXY=http://egress:3128
      - HTTPS_PROXY=http://egress:3128
      # git needs the proxy spelled out too (it honours http.proxy / env):
      - http_proxy=http://egress:3128
      - https_proxy=http://egress:3128
    volumes:
      - ../..:/home/sprout/sona:Z
      # - /path/to/sprout-private:/home/sprout/private:Z
    networks:
      - inside

networks:
  inside:
    internal: true   # no external routing: enforcement, not politeness
  outside:
