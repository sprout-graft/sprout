# Minimal egress allowlist for the reconstituted Sprout.
# The agent container sits on an internal network with no direct route out;
# this proxy is its only path. Everything not listed here is refused.

http_port 3128

acl SSL_ports port 443
acl CONNECT method CONNECT

# The only destinations Sprout needs at runtime.
#   github.com / api.github.com  git, REST, GraphQL
#   api.openrouter.ai            model tokens
#   api.telegram.org             Telegram bot API
#   mcp.openmail.sh              OpenMail MCP endpoint
# Optional package mirrors (uncomment only while installing, then re-comment):
#   registry.npmjs.org, pypi.org, files.pythonhosted.org
acl allowed_sites dstdomain github.com api.github.com api.openrouter.ai api.telegram.org mcp.openmail.sh

http_access deny CONNECT !SSL_ports
http_access allow allowed_sites
http_access deny all

# No caching; this is a filter, not a cache.
cache deny all
access_log none
